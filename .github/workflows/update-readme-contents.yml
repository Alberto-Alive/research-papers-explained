name: Update README Contents

on:
  push:
    paths:
      - "**/*.md"
      - "scripts/update-readme-contents.sh"
      - ".github/workflows/update-readme-contents.yml"
  workflow_dispatch:

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update contents block
        run: bash scripts/update-readme-contents.sh

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README contents list"
          git push
